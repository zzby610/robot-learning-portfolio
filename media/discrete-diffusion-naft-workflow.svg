<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Unified Diffusion VLA via Negative-Aware RL</title>
  <desc id="desc">Research workflow diagram for a diffusion and flow-based vision-language-action policy with positive and negative trajectory feedback for robot manipulation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243044"/>
    </marker>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 43px Arial, Helvetica, sans-serif; fill: #102033; }
      .subtitle { font: 400 21px Arial, Helvetica, sans-serif; fill: #536173; }
      .panel { fill: url(#panelGrad); stroke: #c9d7e8; stroke-width: 2; rx: 22; }
      .box { fill: #ffffff; stroke: #b8c7d9; stroke-width: 2; rx: 18; }
      .box-blue { fill: #eaf2ff; stroke: #2f6fd6; stroke-width: 2; rx: 18; }
      .box-green { fill: #ecfdf5; stroke: #13966a; stroke-width: 2; rx: 18; }
      .box-red { fill: #fff1f1; stroke: #d94a4a; stroke-width: 2; rx: 18; }
      .box-gold { fill: #fff8e6; stroke: #c98716; stroke-width: 2; rx: 18; }
      .label { font: 800 22px Arial, Helvetica, sans-serif; fill: #102033; }
      .body { font: 400 18px Arial, Helvetica, sans-serif; fill: #354459; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #657386; }
      .tiny { font: 700 13px Arial, Helvetica, sans-serif; fill: #657386; letter-spacing: .08em; }
      .metric { font: 900 38px Arial, Helvetica, sans-serif; fill: #185fc7; }
      .formula { font: 700 26px Georgia, "Times New Roman", serif; fill: #102033; }
      .arrow { stroke: #243044; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #6c7a8d; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .flow { stroke: #2f6fd6; stroke-width: 4; fill: none; stroke-linecap: round; }
      .pos { stroke: #13966a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .neg { stroke: #d94a4a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .token { fill: #f8fafc; stroke: #c9d7e8; stroke-width: 1.5; rx: 8; }
      .token-text { font: 700 15px Arial, Helvetica, sans-serif; fill: #354459; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <text class="title" x="80" y="74">Unified Diffusion VLA via Negative-Aware RL</text>
  <text class="subtitle" x="80" y="112">Independent research prototype for aligning flow-based robot action policies with positive and negative rollout feedback</text>

  <rect class="panel" x="70" y="150" width="1460" height="575"/>

  <text class="tiny" x="110" y="192">INPUT CONTEXT</text>
  <rect class="box" x="105" y="215" width="270" height="180"/>
  <text class="label" x="132" y="258">Observation</text>
  <rect class="token" x="132" y="285" width="86" height="42"/>
  <text class="token-text" x="151" y="312">RGB</text>
  <rect class="token" x="230" y="285" width="112" height="42"/>
  <text class="token-text" x="249" y="312">Robot state</text>
  <text class="body" x="132" y="358">visual scene, proprioception,</text>
  <text class="body" x="132" y="384">and task state</text>

  <rect class="box" x="105" y="430" width="270" height="155"/>
  <text class="label" x="132" y="472">Instruction</text>
  <text class="body" x="132" y="510">natural-language goal</text>
  <text class="body" x="132" y="538">for manipulation</text>

  <line class="arrow" x1="400" y1="305" x2="480" y2="305"/>
  <line class="arrow" x1="400" y1="505" x2="480" y2="380"/>

  <text class="tiny" x="500" y="192">POLICY ARCHITECTURE</text>
  <rect class="box-blue" x="500" y="215" width="380" height="370"/>
  <text class="label" x="535" y="258">Diffusion VLA Policy</text>
  <text class="body" x="535" y="296">Diffusion VLM backbone</text>
  <text class="body" x="535" y="326">+ Flow Matching action head</text>

  <path class="flow" d="M 555 392 C 610 340, 700 340, 755 392"/>
  <path class="flow" d="M 755 392 C 700 445, 610 445, 555 392"/>
  <text class="small" x="592" y="385">denoising / flow steps</text>
  <text class="formula" x="555" y="470">v<tspan baseline-shift="sub" font-size="16">theta</tspan>(x<tspan baseline-shift="sub" font-size="16">t</tspan>, t, o, l) -> a<tspan baseline-shift="sub" font-size="16">0</tspan></text>
  <text class="small" x="535" y="525">continuous robot action prediction</text>
  <text class="small" x="535" y="552">for long-horizon manipulation</text>

  <line class="arrow" x1="910" y1="400" x2="990" y2="400"/>

  <text class="tiny" x="1010" y="192">ONLINE ROLLOUT FEEDBACK</text>
  <rect class="box-gold" x="1010" y="215" width="400" height="180"/>
  <text class="label" x="1045" y="258">Rollout and score</text>
  <text class="body" x="1045" y="296">execute policy in LIBERO tasks</text>
  <text class="body" x="1045" y="326">and assign binary / relative reward</text>
  <text class="formula" x="1045" y="368">r in {0, 1}</text>

  <line class="arrow" x1="1210" y1="420" x2="1210" y2="470"/>

  <rect class="box-green" x="970" y="485" width="205" height="135"/>
  <text class="label" x="1000" y="530">Positive</text>
  <text class="body" x="1000" y="566">successful or</text>
  <text class="body" x="1000" y="594">expert-like rollout</text>

  <rect class="box-red" x="1240" y="485" width="205" height="135"/>
  <text class="label" x="1270" y="530">Negative</text>
  <text class="body" x="1270" y="566">failed or</text>
  <text class="body" x="1270" y="594">unstable rollout</text>

  <path class="pos" d="M 1072 620 C 1040 665, 1000 695, 958 720"/>
  <path class="neg" d="M 1342 620 C 1255 705, 1100 755, 960 766"/>

  <text class="tiny" x="480" y="642">NEGATIVE-AWARE ALIGNMENT</text>
  <rect class="box" x="480" y="665" width="475" height="210"/>
  <text class="label" x="515" y="710">Dual velocity update</text>
  <text class="body" x="515" y="748">pull action velocity toward positive trajectories</text>
  <text class="body" x="515" y="778">and push away from negative failure modes</text>
  <text class="formula" x="515" y="828">L = r ||v<tspan baseline-shift="super" font-size="16">+</tspan> - v||<tspan baseline-shift="super" font-size="16">2</tspan> + (1-r)||v<tspan baseline-shift="super" font-size="16">-</tspan> - v||<tspan baseline-shift="super" font-size="16">2</tspan></text>
  <text class="small" x="515" y="860">focus: action consistency, rollout stability, and long-horizon robustness</text>

  <path class="soft-arrow" d="M 510 665 C 420 610, 415 500, 500 455"/>
  <text class="small" x="220" y="660">updated policy is re-evaluated</text>

  <rect class="box-blue" x="1010" y="665" width="400" height="210"/>
  <text class="label" x="1045" y="710">Evaluation summary</text>
  <text class="small" x="1045" y="742">LIBERO manipulation benchmark</text>
  <text class="metric" x="1045" y="800">71% -> 84%</text>
  <text class="body" x="1045" y="840">improved task success in the evaluated setting</text>

  <rect class="box" x="80" y="750" width="345" height="125"/>
  <text class="label" x="108" y="792">Research question</text>
  <text class="body" x="108" y="824">Can failed trajectories become</text>
  <text class="body" x="108" y="852">useful negative guidance for</text>
  <text class="body" x="108" y="872">VLA policy alignment?</text>
</svg>
