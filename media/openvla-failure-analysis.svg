<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenVLA Real-Robot Rollout Diagnostics</title>
  <desc id="desc">A lab-style diagnostic board summarizing observed failure modes in OpenVLA-style real-robot rollouts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .bg { fill: #fbfbf8; }
      .ink { fill: #111827; }
      .muted { fill: #5b6472; }
      .line { stroke: #d6d3ca; stroke-width: 2; fill: none; }
      .thin { stroke: #e6e1d7; stroke-width: 1.4; fill: none; }
      .title { font: 800 42px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #5b6472; }
      .kicker { font: 800 13px Arial, Helvetica, sans-serif; fill: #6b7280; letter-spacing: .12em; }
      .label { font: 800 22px Arial, Helvetica, sans-serif; fill: #111827; }
      .body { font: 400 18px Arial, Helvetica, sans-serif; fill: #374151; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #667085; }
      .mono { font: 700 16px "Consolas", "SFMono-Regular", monospace; fill: #1f2937; }
      .metric { font: 900 48px Arial, Helvetica, sans-serif; fill: #111827; }
      .card { fill: #ffffff; stroke: #d6d3ca; stroke-width: 2; rx: 10; }
      .header { fill: #111827; rx: 16; }
      .tag { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.5; rx: 8; }
      .blue { fill: #2563eb; }
      .green { fill: #059669; }
      .amber { fill: #d97706; }
      .red { fill: #dc2626; }
      .purple { fill: #7c3aed; }
      .arrow { stroke: #1f2937; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2.2; fill: none; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <rect class="header" x="70" y="50" width="1460" height="112"/>
  <text x="105" y="104" style="font: 800 40px Arial, Helvetica, sans-serif; fill: #ffffff;">OpenVLA-style Policy: Real-Robot Rollout Diagnostics</text>
  <text x="105" y="138" style="font: 400 20px Arial, Helvetica, sans-serif; fill: #cbd5e1;">UR5e pick-and-place adaptation study with limited real-robot demonstrations</text>

  <text class="kicker" x="86" y="220">EXPERIMENT SETUP</text>
  <rect class="card" x="70" y="240" width="420" height="240"/>
  <text class="label" x="105" y="288">Adaptation setting</text>
  <rect class="tag" x="105" y="315" width="120" height="38"/>
  <text class="mono" x="128" y="340">LIBERO</text>
  <rect class="tag" x="238" y="315" width="116" height="38"/>
  <text class="mono" x="266" y="340">UR5e</text>
  <rect class="tag" x="367" y="315" width="80" height="38"/>
  <text class="mono" x="386" y="340">ROS 2</text>
  <text class="body" x="105" y="392">OpenVLA-style action-token policy</text>
  <text class="body" x="105" y="425">fine-tuned with LoRA and limited</text>
  <text class="body" x="105" y="458">real-robot trajectories.</text>

  <rect class="card" x="70" y="515" width="420" height="295"/>
  <text class="label" x="105" y="563">Evaluation note</text>
  <text class="metric" x="105" y="632">61%</text>
  <text class="body" x="225" y="618">task success</text>
  <text class="small" x="105" y="675">The result is used as a diagnostic signal,</text>
  <text class="small" x="105" y="700">not as a claim of a new VLA architecture.</text>
  <line class="thin" x1="105" y1="728" x2="455" y2="728"/>
  <text class="mono" x="105" y="764">Question:</text>
  <text class="body" x="200" y="764">Where does benchmark-to-robot</text>
  <text class="body" x="105" y="792">transfer fail under latency and limited data?</text>

  <text class="kicker" x="550" y="220">FAILURE TAXONOMY</text>
  <rect class="card" x="535" y="240" width="995" height="570"/>

  <rect class="blue" x="575" y="290" width="8" height="120"/>
  <text class="label" x="605" y="316">Action discretization</text>
  <text class="body" x="605" y="354">Continuous 7D commands are</text>
  <text class="body" x="605" y="382">mapped into discrete tokens.</text>
  <text class="small" x="605" y="410">Symptom: small pose error near target.</text>

  <rect class="amber" x="575" y="455" width="8" height="120"/>
  <text class="label" x="605" y="481">Inference latency</text>
  <text class="body" x="605" y="519">VLM inference is slower than</text>
  <text class="body" x="605" y="547">low-level control loops.</text>
  <text class="small" x="605" y="575">Symptom: delayed correction.</text>

  <rect class="purple" x="1045" y="290" width="8" height="120"/>
  <text class="label" x="1075" y="316">Visual distribution shift</text>
  <text class="body" x="1075" y="354">LIBERO-style scenes differ from</text>
  <text class="body" x="1075" y="382">the real camera and workspace.</text>
  <text class="small" x="1075" y="410">Symptom: unstable object grounding.</text>

  <rect class="red" x="1045" y="455" width="8" height="120"/>
  <text class="label" x="1075" y="481">Rollout instability</text>
  <text class="body" x="1075" y="519">Early action errors shift later</text>
  <text class="body" x="1075" y="547">observations off-manifold.</text>
  <text class="small" x="1075" y="575">Symptom: compounding drift.</text>

  <line class="thin" x1="575" y1="620" x2="1490" y2="620"/>
  <text class="kicker" x="575" y="660">DIAGNOSTIC TAKEAWAY</text>
  <text class="body" x="575" y="700">The main research value is identifying transfer bottlenecks when a VLA policy</text>
  <text class="body" x="575" y="728">moves from benchmark data to a physical robot.</text>
  <text class="body" x="575" y="762">This motivates better action representations, latency-aware inference,</text>
  <text class="body" x="575" y="790">real-robot data quality, and closed-loop recovery.</text>

  <path class="arrow" d="M 490 363 C 515 363, 515 363, 535 363"/>
  <path class="arrow" d="M 490 658 C 515 658, 515 658, 535 658"/>

  <text class="kicker" x="80" y="858">PORTFOLIO CAPTION</text>
  <text class="small" x="270" y="858">Qualitative diagnostics from UR5e rollouts: action discretization, latency, visual shift, and closed-loop instability.</text>
</svg>
